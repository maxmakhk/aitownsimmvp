    <style>

            margin: 0 auto;
            display: flex;
            flex-direction: column;

                max-width: 100%;
            }

            .container {
                flex-direction: row;
                max-width: 100%;
                height: 100vh;
            }

            .container > h1 {

            }

        /* Vertical layout for narrow screens */
        @media (max-aspect-ratio: 5/3) {

            .right-panel {

        }

        .settings-button {
            position: fixed;
            top: 4px;

            height: 32px;
            border-radius: 50%;
            background: #0a0a0a;
            border: 2px solid #00ff00;
            color: #00ff00;

            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;

        .settings-panel {

            left: 16px;

        .sticky-top {

        .status-bar {

        .map-tile {

<body>
    <div class="container">
        <button class="settings-button" id="settingsBtn" onclick="toggleSettings()">⚙️</button>
        <div class="settings-panel" id="settingsPanel">
            <h3>Settings</h3>
            <label for="npcLanguageSelect">NPC Language</label>
            <select id="npcLanguageSelect" onchange="onLanguageSelect()">
                <option value="en">English</option>
                <option value="zh-TW">Traditional Chinese</option>
            </select>
            <div class="controls">
                <button id="installBtn" onclick="installApp()" style="display: none;">📱 Add to Home Screen</button>
                <button onclick="initGame()">🔄 Reset Game</button>
                <button onclick="clearLog()">🗑️ Clear Log</button>
            </div>
        </div>

        <h1>INSIDERS</h1>
        
        <div class="left-panel">
            <div class="sticky-top">
                <div class="status-bar">
                    <div class="status-info">
                        <div>⏰ <span id="timeDisplay">Day 1, 08:00</span></div>
                        <div>🌤️ <span id="weatherDisplay">Sunny</span></div>
                    </div>
                </div>
                <canvas id="mapCanvas" style="width: 100%; max-width: 100%; background: #1a1a1a; border-radius: 4px;"></canvas>
            </div>
        </div>

        <div class="right-panel">
            <div id="chatLog" style="height: 200px; overflow-y: auto; margin-top: 10px;"></div>

            <div class="action-bar" id="actionBar">
                <div class="action-bar-header">
                    <div class="action-bar-info" id="actionBarInfo">all npc processing automatically</div>
                    <div class="action-bar-nav">
                        <button class="nav-btn" id="backBtn" onclick="handleBack()" style="display: none;">◀</button>
                        <button class="nav-btn" id="cancelBtn" onclick="handleCancel()" style="display: none;">❌</button>
                        <button class="nav-btn" id="nextHourBtn" onclick="runNextHourPlayer()">⏭️ Next Hour</button>
                    </div>
                </div>
                <div class="player-emoji-row" id="playerEmojiRow" style="display: none;"></div>
                <div class="icon-grid" id="placeGrid" style="display: none;"></div>
                <div class="icon-grid" id="actionGrid" style="display: none;"></div>
            </div>
        </div>

        <div id="loadingIndicator">
            <span class="spinner"></span> AI Processing...
        </div>
    </div>

    <script>
        // Game State
        let gameState = null;
        let isProcessing = false;
        let playerAction = { npcId: null, location: null, action: null, pending: false };
        let activeEventCards = []; // Track currently active event cards

        // Ability Values
        const ABILITY_LIMITS = {
            rest: 100,
            food: 100,
            money: 9999,
            joyful: 100
        };

        const HOURLY_DECAY = {
            rest: 7,
            food: 10
        };

        // Initialize Game
        // Parse URL parameters
        function getURLParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function initGame() {
            log('system', '=== INITIALIZING GAME ===');
            
            try {
                // Load configuration
                const response = await fetch('town_config.json');
                gameState = await response.json();
                
                // Random weather for initial day
                const weatherOptions = gameState.world.weather_options || ['sunny', 'cloudy', 'rainy'];
                gameState.world.weather = weatherOptions[Math.floor(Math.random() * weatherOptions.length)];

                // Default NPC language
                if (!gameState.world.npc_language) {
                    gameState.world.npc_language = 'en';
                }

                // Check URL parameter for language setting
                const languageParam = getURLParameter('language');
                if (languageParam) {
                    if (languageParam.toLowerCase() === 'chinese') {
                        gameState.world.npc_language = 'zh-TW';
                        log('system', '✓ Language set to Traditional Chinese from URL');
                    } else if (languageParam.toLowerCase() === 'english') {
                        gameState.world.npc_language = 'en';
                        log('system', '✓ Language set to English from URL');
                    }
                }
                
                // Copy base schedules to active schedules
                for (let npcId in gameState.npcs) {
                    gameState.npcs[npcId].active_schedule = {...gameState.npcs[npcId].base_schedule};
                    ensureAbilityValues(gameState.npcs[npcId]);
                    ensureFriends(gameState.npcs[npcId]);
                }
                
                log('system', `✓ Loaded ${Object.keys(gameState.npcs).length} NPCs`);
                log('system', `✓ Loaded ${Object.keys(gameState.world.locations).length} locations`);
                log('system', `✓ Initial weather: ${gameState.world.weather}`);
                log('system', '✓ Game initialized successfully');
                log('system', '');
                
                updateStatusBar();
                updateTownView();
                updateActionBar();
                initializeMapView();
                updateLanguageSelect();
                logCurrentState();
                
            } catch (error) {
                log('error', `Failed to initialize: ${error.message}`);
            }
        }

        // Roll for random event cards each hour
        function rollEventCards() {
            if (!gameState || !gameState.eventcards) return;

            gameState.eventcards.forEach(card => {
                // Check if this card is already active
                const isAlreadyActive = activeEventCards.some(activeCard => activeCard.id === card.id);
                if (isAlreadyActive) {
                    return; // Skip this card, already running
                }

                const roll = Math.random();
                if (roll < card.percentage_chance) {
                    const eventInstance = {
                        ...card,
                        activated_hour: gameState.world.time.hour,
                        expires_hour: (gameState.world.time.hour + card.duration_hours) % 24
                    };
                    activeEventCards.push(eventInstance);
                    log('system', `\n🎲 [EVENT] ${card.title}! ${card.description}`);
                    log('system', `   ⏱️ Active for ${card.duration_hours} hours`);
                }
            });
        }

        // Clean up expired event cards and reverse effects
        function updateActiveEventCards() {
            const currentHour = gameState.world.time.hour;
            const expiredCards = activeEventCards.filter(card => {
                const isExpired = currentHour >= card.expires_hour;
                return isExpired;
            });

            // Reverse effects of expired cards
            expiredCards.forEach(card => {
                if (card.affected_npcs) {
                    card.affected_npcs.forEach(({ npcId, effects }) => {
                        const npc = gameState.npcs[npcId];
                        if (npc) {
                            // Reverse the effects
                            if (effects.money) npc.abilities.money -= effects.money;
                            if (effects.food) npc.abilities.food -= effects.food;
                            if (effects.rest) npc.abilities.rest -= effects.rest;
                            if (effects.joyful) npc.abilities.joyful -= effects.joyful;
                        }
                    });
                }
                log('system', `   ✖️ Event "${card.title}" expired`);
            });

            // Remove expired cards
            activeEventCards = activeEventCards.filter(card => {
                const isExpired = currentHour >= card.expires_hour;
                return !isExpired;
            });
        }

        // Apply event card effects to an NPC
        function applyEventCardEffects(npc) {
            activeEventCards.forEach(card => {
                const effect = card.effect;
                let shouldApply = false;

                // Check if card applies to this NPC
                if (effect.global) {
                    // Global effect applies to everyone

        function getScheduleEntryForHour(schedule, currentHour) {
            if (schedule[currentHour]) {
                return { hour: currentHour, entry: schedule[currentHour] };
            }

            const hours = Object.keys(schedule)
                .map(h => Number(h))
                .filter(h => Number.isFinite(h))
                .sort((a, b) => a - b);

            if (hours.length === 0) {
                return null;
            }

            const earlierHours = hours.filter(h => h <= currentHour);
            if (earlierHours.length > 0) {
                const hour = earlierHours[earlierHours.length - 1];
                return { hour, entry: schedule[hour] };
            }

            const wrapHour = hours[hours.length - 1];
            return { hour: wrapHour, entry: schedule[wrapHour] };
        }

        async function buildActionOptionsBasedOnNeeds(npc, baseLocation) {
            const options = [];
            const THRESHOLD = 50; // Below this is "low"
            let totalNeed = 0;
            const needs = {};

            // Analyze what NPC is lacking
            needs.rest = Math.max(0, THRESHOLD - npc.abilities.rest);
            needs.food = Math.max(0, THRESHOLD - npc.abilities.food);
            needs.money = Math.max(0, THRESHOLD - npc.abilities.money);
            needs.joyful = Math.max(0, THRESHOLD - npc.abilities.joyful);
            totalNeed = needs.rest + needs.food + needs.money + needs.joyful;

            // Base schedule - always an option
            options.push({ location: baseLocation, weight: 100, reasons: ['schedule'] });

            if (totalNeed === 0) {
                // All abilities are healthy, stick to schedule
                return options;
            }

            // Scan all locations and their available actions
            const locationScores = {};
            for (let locationId in gameState.world.locations) {
                let bestScore = 0;
                let bestActions = [];
                
                const actions = gameState.world.locations[locationId].actions || [];
                for (let action of actions) {
                    const effects = getActionEffects(action);
                    let score = 0;

                    // Score how well this action addresses the needs
                    if (needs.rest > 0 && effects.rest) score += Math.min(needs.rest, effects.rest) * 2;
                    if (needs.food > 0 && effects.food) score += Math.min(needs.food, effects.food) * 1.5;
                    if (needs.money > 0 && effects.money) score += Math.min(needs.money, effects.money) * 2;
                    if (needs.joyful > 0 && effects.joyful) score += Math.min(needs.joyful, effects.joyful) * 1.5;

                    if (score > bestScore) {
                        bestScore = score;
                        bestActions = [action];
                    } else if (score === bestScore && score > 0) {
                        bestActions.push(action);
                    }
                }

                if (bestScore > 0) {
                    locationScores[locationId] = bestScore;
                }
            }

            // Add high-scoring locations as options
            const sortedLocations = Object.entries(locationScores)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3); // Top 3 locations

            for (const [location, score] of sortedLocations) {
                const needTypes = [];
                if (needs.rest > 0) needTypes.push('tired');
                if (needs.food > 0) needTypes.push('hungry');
                if (needs.money > 0) needTypes.push('poor');
                if (needs.joyful > 0) needTypes.push('sad');

                options.push({
                    location,
                    weight: score,
                    reasons: needTypes
                });
            }

            return options;
        }

        async function weightedChoice(npc, nextHour, options) {
            const merged = mergeOptions(options);
            const entries = Object.entries(merged)
                .filter(([, data]) => data.weight > 0)
                .map(([location, data]) => ({ location, ...data }));

            const total = entries.reduce((sum, item) => sum + item.weight, 0);
            let roll = Math.random() * total;
            let chosen = entries.length ? entries[0].location : null;
            let chosenReasons = [];

            for (let item of entries) {
                roll -= item.weight;
                if (roll <= 0) {
                    chosen = item.location;
                    chosenReasons = item.reasons;
                    break;
                }
            }

            const weights = entries.reduce((map, item) => {
                map[item.location] = item.weight;
                return map;
            }, {});

            return { chosen, reasons: chosenReasons, weights };
        }

        function getForcedPlan(npc, nextHour) {
            if (!npc.forced_plans || npc.forced_plans.length === 0) return null;
            const index = npc.forced_plans.findIndex(plan => plan.hour === nextHour);
            if (index === -1) return null;
            const plan = npc.forced_plans[index];
            npc.forced_plans.splice(index, 1);
            return plan;
        }

        function mergeOptions(options) {
            const merged = {};
            options.forEach(option => {
                if (!merged[option.location]) {
                    merged[option.location] = { weight: 0, reasons: [] };
                }
                merged[option.location].weight += option.weight;
                merged[option.location].reasons = Array.from(new Set([
                    ...merged[option.location].reasons,
                    ...option.reasons
                ]));
            });
            return merged;
        }

        function updateFriendTags(friend) {
            const statusTags = ['friendly', 'close', 'unfriendly', 'hostile', 'neutral'];
            const baseTags = (friend.tag || []).filter(t => !statusTags.includes(t));
            let status = null;
            if (friend.relationshipMark >= 6) status = 'close';
            else if (friend.relationshipMark >= 3) status = 'friendly';
            else if (friend.relationshipMark <= -6) status = 'hostile';
            else if (friend.relationshipMark <= -3) status = 'unfriendly';
            else status = null;

            friend.tag = status ? [...new Set([...baseTags, status])] : baseTags;

        function scoreSentiment(message) {
            const text = message.toLowerCase();
            const positive = ['thanks', 'thank', 'good', 'great', 'nice', 'love', 'friend', 'help', 'happy', 'welcome', 'glad', 'appreciate'];
            const negative = ['hate', 'angry', 'bad', 'annoy', 'stupid', 'idiot', 'rude', 'fight', 'argue', 'upset', 'insult'];
            let score = 0;
            positive.forEach(word => { if (text.includes(word)) score += 1; });
            negative.forEach(word => { if (text.includes(word)) score -= 1; });
            if (text.includes('sorry')) score += 1;
            return Math.max(-2, Math.min(2, score));

        }

function detectGroupPlan(text, npcIds, currentLocation) {
    const lower = text.toLowerCase();
    const target = extractPlannedLocation(lower, npcIds);
    if (!target) return null;

    const hour = extractPlannedHour(lower);
    const reason = extractPlanReason(lower);

    npcIds.forEach(npcId => {
        const npc = gameState.npcs[npcId];
        if (!npc.forced_plans) npc.forced_plans = [];
        npc.forced_plans.push({ hour, location: target, reason, members: [...npcIds] });
    });

    return {
        location: target,
        hour,
        reason,
        summary: `${npcIds.map(id => gameState.npcs[id].name).join(' & ')} will go to ${target} at ${String(hour).padStart(2, '0')}:00 (${reason})`
    };
}

function extractPlannedLocation(text, npcIds) {
    const locationKeys = Object.keys(gameState.world.locations);
    for (let key of locationKeys) {
        if (text.includes(key)) return key;
    }

    if (text.includes('tavern')) return 'tavern';
    if (text.includes('market')) return 'market';
    if (text.includes('church')) return 'church';
    if (text.includes('town square') || text.includes('square')) return 'town_square';
    if (text.includes('home')) {
        const firstNpc = gameState.npcs[npcIds[0]];
        return firstNpc.home || currentLocation;
    }

    return null;
}

function extractPlannedHour(text) {
    const explicitHour = text.match(/\b(\d{1,2})(?:[:.]00)?\b/);
    if (explicitHour) {
        const hour = parseInt(explicitHour[1], 10);
        if (!Number.isNaN(hour) && hour >= 0 && hour <= 23) return hour;
    }

    if (text.includes('next hour') || text.includes('later')) {
        return (gameState.world.time.hour + 1) % 24;
    }

    if (text.includes('tonight')) {
        return 20;
    }

    return (gameState.world.time.hour + 1) % 24;
}

function extractPlanReason(text) {
    if (text.includes('eat') || text.includes('hungry')) return 'hungry';
    if (text.includes('rest') || text.includes('sleep')) return 'sleepy';
    if (text.includes('work') || text.includes('job') || text.includes('money')) return 'poor';
    return 'together';
}

        // Call Ollama API
        async function callOllamaAPI(prompt) {
        console.log('Ollama Prompt:', prompt);
        const maxAttempts = 3;
        const timeoutMs = 60000;

        for (let attempt = 1; attempt <= maxAttempts; attempt++) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                'Content-Type': 'application/json',
                },
                credentials: 'same-origin',
                body: JSON.stringify({ prompt }),
                signal: controller.signal,
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const data = await response.json();
            if (data.error) {
                throw new Error(data.error);
            }
            console.log('Ollama Response:', data.content);
            return data.content;
            } catch (error) {
            console.error(`callOllamaAPI error (attempt ${attempt}/${maxAttempts}):`, error);
            if (attempt === maxAttempts) {
                console.warn('Ollama failed, attempting xAI API fallback...');
                try {
                    return await callXAIAPI(prompt);
                } catch (xaiError) {
                    throw new Error(`Ollama failed and xAI fallback failed: ${xaiError.message}`);
                }
            }
            await new Promise(resolve => setTimeout(resolve, 500 * attempt));
            } finally {
            clearTimeout(timeoutId);
            }
        }
        }

        async function callXAIAPI(prompt) {
            console.log('Using xAI API fallback via backend...');
            try {
                const response = await fetch('/api/chat/fallback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) {
                    throw new Error(`Backend HTTP ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }

                const content = data.content || '';
                console.log('xAI Response:', content);

            for (let row = 0; row < tiles.length; row++) {
                for (let col = 0; col < tiles[row].length; col++) {
                    const x = gridPadding + col * tileSize;
                    const y = gridPadding + row * tileSize;
                    if (sandImg.complete) {
                        ctx.drawImage(sandImg, x, y, tileSize, tileSize);
                    } else {
                        // Fallback while loading
                        ctx.fillStyle = '#d4b896';
                        ctx.fillRect(x, y, tileSize, tileSize);
                    }
                }
            }

            // Second pass: draw tile-specific images
            for (let row = 0; row < tiles.length; row++) {
                for (let col = 0; col < tiles[row].length; col++) {
                    const tileId = tiles[row][col];
                    const x = gridPadding + col * tileSize;
                    const y = gridPadding + row * tileSize;

                    // Load and draw tile image
                    const tileImg = loadImage(`images/map/${tileId}.png`);
                    if (tileImg.complete) {
                        ctx.drawImage(tileImg, x, y, tileSize, tileSize);
                    } else {
                        // Fallback while loading - show emoji
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `${tileSize * 0.4}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        if (tileId === 'road') {
                            ctx.fillText('🛣️', x + tileSize / 2, y + tileSize / 2);
                        } else {
                            const location = gameState.world.locations[tileId];
                            if (location) {
                                ctx.fillText(location.emoji || '🏛️', x + tileSize / 2, y + tileSize / 2);
                            }
                        }
                    }

                    // Store tile info for click detection
                    if (!canvas.tiles) canvas.tiles = {};
                    canvas.tiles[tileId] = { x, y, width: tileSize, height: tileSize };
                }
            }

            // Draw NPCs
            const locationNPCs = {};
            for (let npcId in gameState.npcs) {
                const npc = gameState.npcs[npcId];
                const loc = npc.location;
                if (!locationNPCs[loc]) {
                    locationNPCs[loc] = [];
                }
                locationNPCs[loc].push(npc);
            }

            // Initialize animations for moved NPCs
            for (let npcId in gameState.npcs) {
                const npc = gameState.npcs[npcId];
                const currentLoc = npc.location;
                const previousLoc = npcPreviousLocations[npcId];

                if (previousLoc && previousLoc !== currentLoc && !npcAnimations[npcId]) {
                    const fromTile = canvas.tiles[previousLoc];
                    const toTile = canvas.tiles[currentLoc];
                    if (fromTile && toTile) {
                        npcAnimations[npcId] = {
                            npc,
                            startX: fromTile.x + fromTile.width / 2,
                            startY: fromTile.y + fromTile.height / 2,
                            endX: toTile.x + toTile.width / 2,
                            endY: toTile.y + toTile.height / 2,
                            progress: 0,
                            duration: 1500
                        };
                    }
                }

                npcPreviousLocations[npcId] = currentLoc;
            }

            // Store for animation loop
            canvas.locationNPCs = locationNPCs;
            canvas.tileSize = tileSize;
            canvas.gridPadding = gridPadding;
            canvas.ctx = ctx;

            // Add click handler
            if (!canvas.clickHandlerAdded) {
                canvas.onclick = (e) => handleMapCanvasClick(e, canvas);
                canvas.clickHandlerAdded = true;
            }

            // Draw NPCs at their locations
            drawNPCsOnCanvas();
        }

        function drawNPCsOnCanvas() {
            const canvas = document.getElementById('mapCanvas');
            if (!canvas) return;

            const ctx = canvas.ctx || canvas.getContext('2d');
            const locationNPCs = canvas.locationNPCs;

            if (!locationNPCs || !canvas.tiles) return;

            // Draw NPCs at their locations
            for (let location in locationNPCs) {
                const npcs = locationNPCs[location];
                const tile = canvas.tiles[location];
                if (!tile) continue;

                npcs.forEach((npc, index) => {
                    // Skip if this NPC is being animated
                    if (npcAnimations[getNpcIdByName(npc.name)]) return;

                    const offsetX = (index % 2) * 12 - 6;
                    const offsetY = Math.floor(index / 2) * 12 - 6;
                    const x = tile.x + tile.width - 20 + offsetX;
                    const y = tile.y + 10 + offsetY;

                    ctx.font = `20px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(npc.emoji || '👤', x, y);
                });
            }

            // Draw animated NPCs
            for (let npcId in npcAnimations) {
                const anim = npcAnimations[npcId];
                const x = anim.startX + (anim.endX - anim.startX) * anim.progress;
                const y = anim.startY + (anim.endY - anim.startY) * anim.progress;

                ctx.font = `20px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(anim.npc.emoji || '👤', x, y);
            }
        }

        function updateMapAnimation() {
            // Update animation progress
            for (let npcId in npcAnimations) {
                const anim = npcAnimations[npcId];
                anim.progress += 16 / anim.duration; // 16ms per frame

                if (anim.progress >= 1) {
                    anim.progress = 1;
                    delete npcAnimations[npcId];
                }
            }

            // Redraw canvas
            renderMapViewCanvas();
            drawNPCsOnCanvas();
        }

        function startMapAnimation() {
            if (mapAnimationId) return;
            function animate() {
                updateMapAnimation();
                mapAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopMapAnimation() {
            if (mapAnimationId) {
                cancelAnimationFrame(mapAnimationId);
                mapAnimationId = null;
            }
        }

        function handleMapCanvasClick(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let tileId in canvas.tiles) {
                const tile = canvas.tiles[tileId];
                if (x >= tile.x && x <= tile.x + tile.width &&
                    y >= tile.y && y <= tile.y + tile.height) {
                    showLocationDialogue(tileId);
                    return;
                }
            }
        }

        function getNpcIdByName(npcName) {
            for (let npcId in gameState.npcs) {
                if (gameState.npcs[npcId].name === npcName) {
                    return npcId;
                }
            }
            return null;
        }

        function showLocationDialogue(locationId) {
            if (!gameState || !gameState.world.locations[locationId]) return;

            const message = locationMessages[locationId];
            if (!message) return;

            // Remove any existing dialogue
            const existingDialogue = document.querySelector('.map-dialogue');
            if (existingDialogue) {
                existingDialogue.remove();
            }

            // Split message into dialogue lines (one line per person)
            // First line is the header "💬 At 🏪 market:"
            const allLines = message.split('\n').filter(line => line.trim());
            const headerLine = allLines[0];
            const dialogueLines = allLines.slice(1);
            const totalPages = dialogueLines.length;
            let currentPage = 0;

            // Create backdrop
            const backdrop = document.createElement('div');
            backdrop.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999;';

            // Create dialogue popup
            const dialogue = document.createElement('div');
            dialogue.className = 'map-dialogue';
            
            // Prevent closing when clicking inside dialogue
            dialogue.onclick = (e) => {
                e.stopPropagation();
            };

            const header = document.createElement('div');
            header.style.cssText = 'color: #ffffff; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #00ff00; padding-bottom: 8px;';
            header.innerHTML = headerLine;

            const content = document.createElement('div');
            content.className = 'map-dialogue-content';

            const pageIndicator = document.createElement('div');
            pageIndicator.className = 'map-dialogue-page';

            const navContainer = document.createElement('div');
            navContainer.className = 'map-dialogue-nav';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'map-dialogue-close';
            prevBtn.textContent = '◀';
            prevBtn.onclick = () => {
                if (currentPage > 0) {
                    currentPage--;
                    updateDialoguePage();
                }
            };

            const nextBtn = document.createElement('button');
            nextBtn.className = 'map-dialogue-close';
            nextBtn.textContent = '▶';
            nextBtn.onclick = () => {
                if (currentPage < totalPages - 1) {
                    currentPage++;
                    updateDialoguePage();
                }
            };

            const closeBtn = document.createElement('button');
            closeBtn.className = 'map-dialogue-close';
            closeBtn.textContent = '✖';
            closeBtn.onclick = () => {
                backdrop.remove();
                dialogue.remove();
            };

            function updateDialoguePage() {
                const currentLine = dialogueLines[currentPage];
                content.innerHTML = currentLine;
                
                // Update page indicator
                if (totalPages > 1) {
                    pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;
                    pageIndicator.style.display = 'block';
                } else {
                    pageIndicator.style.display = 'none';
                }
                
                // Update navigation buttons
                navContainer.innerHTML = '';
                
                if (currentPage > 0) {
                    navContainer.appendChild(prevBtn);
                }
                
                if (currentPage < totalPages - 1) {
                    navContainer.appendChild(nextBtn);
                } else {
                    navContainer.appendChild(closeBtn);
                }
            }

            backdrop.onclick = () => {
                backdrop.remove();
                dialogue.remove();
            };

            dialogue.appendChild(header);
            dialogue.appendChild(content);
            dialogue.appendChild(pageIndicator);
            dialogue.appendChild(navContainer);
            document.body.appendChild(backdrop);
            document.body.appendChild(dialogue);

            updateDialoguePage();
        }

        // Store location messages when NPCs perform actions
        function storeLocationMessage(locationId, message) {
            locationMessages[locationId] = message;
        }

        // Logging function
        function log(type, message) {
            const chatLog = document.getElementById('chatLog');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = message;
            chatLog.appendChild(entry);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Clear log
        function clearLog() {
            document.getElementById('chatLog').innerHTML = '';
        }

        // Web App Install Prompt
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').style.display = 'block';
        });

        window.addEventListener('appinstalled', () => {
            console.log('PWA was installed');
            document.getElementById('installBtn').style.display = 'none';
            deferredPrompt = null;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // Auto-initialize on load
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
